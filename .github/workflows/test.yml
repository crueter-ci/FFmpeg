name: Test Build

on:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7

      - name: Download
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Get Version
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Generate Changelog
        run: |
          ./tools/changelog.sh > changelog.md

      - name: Test
        run: |
          echo "Version: $VERSION"
          echo
          cat changelog.md

      - name: Check artifacts
        run:
          find -name "*.tar.zst*"